<!doctype html>
<html lang="en">
  <head>
    <title>&lt;model-viewer&gt; template</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <!-- Added 'auto-rotate' so it spins on its own, and ensured interaction attributes are active -->
    <model-viewer 
      src="2mb_fagervollen_modern_shifted.glb" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      auto-rotate
      interaction-prompt="auto"
      tone-mapping="neutral" 
      poster="poster.webp" 
      shadow-intensity="1">
      
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png" alt="AR prompt">
      </div>
    </model-viewer>  

    <!-- If script.js contains conflicting logic, comment it out temporarily -->
    <script src="script.js"></script>
    
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  </body>
</html>
